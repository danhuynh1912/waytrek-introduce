# Deploy waytrek.site lên Cloudflare Pages (project `waytrek-site`) mỗi lần push main.
# Thay cho Vercel từ 28/10/2026 (Vercel Hobby cấm dùng thương mại).
#
# Secrets cần có trong repo:
#   CLOUDFLARE_API_TOKEN  — token CHỈ có quyền Account › Cloudflare Pages › Edit
#   CLOUDFLARE_ACCOUNT_ID — 4ad3a913fadddd02ae96a51ce9875c5f (không bí mật)
#
# Deploy tay (cùng lệnh, từ máy):
#   npm run build && (cd /tmp && npx wrangler@4.153.0 pages deploy "$OLDPWD/dist" \
#     --project-name waytrek-site --branch main)
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Hai lần push sát nhau: chỉ bản sau cùng được lên, không chạy chồng.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Thiếu 404.html là điều kiện để Pages chạy chế độ SPA (đường dẫn con trả
      # index.html). Có file đó thì mọi /trail/…, /j/… thành 404.
      - name: Kiểm dist
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/.well-known/apple-app-site-association
          test -f dist/.well-known/assetlinks.json
          if [ -f dist/404.html ]; then echo "dist/404.html tắt chế độ SPA của Pages"; exit 1; fi

      # Chạy wrangler NGOÀI thư mục repo: bản 4.x tự "cấu hình" project
      # (sửa package.json, vite.config.ts) khi thấy mình đứng trong một app Vite.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ runner.temp }}
        run: >
          npx --yes wrangler@4.153.0 pages deploy "$GITHUB_WORKSPACE/dist"
          --project-name waytrek-site --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$(git -C "$GITHUB_WORKSPACE" log -1 --format=%s)"
          --commit-dirty=true
